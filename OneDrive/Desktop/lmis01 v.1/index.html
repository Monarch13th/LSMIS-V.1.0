<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#007A53" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LSMIS" />
    <title>Livestock Slaughter &amp; Meat Inspection Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/hero-inspector.jpg" fetchpriority="high" />
    <script>
      (function() {
        try {
          var sessionRaw = sessionStorage.getItem('lsmis_session') || localStorage.getItem('lsmis_session');
          var userTheme = 'light';
          if (sessionRaw) {
            try {
              var sess = JSON.parse(sessionRaw);
              var id = sess && (sess.id || sess.user_id || (sess.email ? String(sess.email).toLowerCase().trim() : null) || sess.username || sess.role);
              if (id) {
                userTheme = localStorage.getItem('lsmis_theme_user_' + id) || 'light';
              }
            } catch (e) {}
          } else {
            userTheme = localStorage.getItem('lsmis_theme_guest') || 'light';
          }
          var theme = (userTheme === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
